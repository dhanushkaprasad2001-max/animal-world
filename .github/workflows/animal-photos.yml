name: Download and host animal photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'animal-guides.html'
      - 'scripts/download_animal_photos.py'
      - 'scripts/build_animal_articles.py'
      - '.github/workflows/animal-photos.yml'
permissions:
  contents: write
concurrency:
  group: animal-photo-library
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install --upgrade Pillow
      - name: Download licensed photographs into the website
        run: python scripts/download_animal_photos.py
      - name: Build static species articles for the full directory
        run: python scripts/build_animal_articles.py
      - name: Commit animal photos, article pages and attribution records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animals articles articles.html animal-guides.html
          if git diff --cached --quiet; then
            echo "No changes to animal photos or article library."
          else
            git commit -m "Add locally hosted animal photographs and credits"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            echo 'Could not push after five retries' >&2
            exit 1
          fi
